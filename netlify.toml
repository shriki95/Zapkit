[build]
  base    = "frontend"
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # ⬇ Replace with your Railway backend URL after deploying
  VITE_API_URL = "https://zapkit-backend-production.up.railway.app"

# SPA fallback — all routes go to index.html (React Router handles them client-side)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options             = "DENY"
    X-Content-Type-Options      = "nosniff"
    Referrer-Policy             = "strict-origin-when-cross-origin"
    Permissions-Policy          = "geolocation=(), camera=(), microphone=()"
