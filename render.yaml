services:
  # ── Backend API ───────────────────────────────────────────────────────────────
  - type: web
    name: zapkit-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: zapkit-db
          property: connectionString
      - key: BASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://zapkit.netlify.app"

databases:
  - name: zapkit-db
    databaseName: zapkit
    user: zapkit
    plan: free
