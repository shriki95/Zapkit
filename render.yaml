services:
  # Backend API
  - type: web
    name: zapkit-backend
    runtime: python
    plan: free
    rootDir: tinylink-pro/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: zapkit-db
          property: connectionString
      - key: BASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

  # Frontend Static Site
  - type: web
    name: zapkit-frontend
    runtime: static
    buildCommand: chmod +x build.sh && ./build.sh
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "18"
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /tinylink
        destination: /tinylink/index.html
      - type: rewrite
        source: /tinylink/*
        destination: /tinylink/index.html
      - type: rewrite
        source: /qr
        destination: /qr/index.html
      - type: rewrite
        source: /qr/*
        destination: /qr/index.html
      - type: rewrite
        source: /*
        destination: /home/index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

databases:
  - name: zapkit-db
    databaseName: zapkit
    user: zapkit
    plan: free
